{% extends 'base.html' %}

{% block title %}Личный кабинет{% endblock %}

{% block content %}
<section class="auth-card account-card" aria-labelledby="page-title">
    <a class="brand" href="{% url 'register' %}">
        <span class="brand__icon" aria-hidden="true">H</span>
        <span class="brand__name">Havbat Gir</span>
    </a>
    <p class="eyebrow">Личный кабинет</p>
    <h1 id="page-title">Добро пожаловать!</h1>
    <p class="auth-intro">Вы вошли как <strong>{{ request.user.email }}</strong>.</p>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="button button--secondary" type="submit">Выйти из аккаунта</button>
    </form>
</section>
{% endblock %}
